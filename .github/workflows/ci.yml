# Build and test on every push and pull request.
# Dependencies are not in this repository; they are checked out at the commits pinned in
# cmake/DependencyLock.cmake. Status: authored and dry-run locally (same scripts and presets),
# not yet executed on GitHub-hosted runners.
name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GAMEENGINE_RESOURCES_DIR: ${{ github.workspace }}/../resources
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: python -m pip install ninja==1.11.1.1

      - name: Fetch locked dependencies
        run: python -I cmake/scripts/fetch_dependencies.py "$env:GAMEENGINE_RESOURCES_DIR" box3d GameNetworkingSockets

      - name: Configure
        shell: pwsh
        run: ./cmake/scripts/dev-shell.ps1 cmake --preset windows-msvc-ci

      - name: Build
        shell: pwsh
        run: ./cmake/scripts/dev-shell.ps1 cmake --build --preset windows-msvc-ci

      - name: Test
        shell: pwsh
        run: ./cmake/scripts/dev-shell.ps1 ctest --preset windows-msvc-ci --output-junit ctest-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-windows-msvc
          path: build/windows-msvc-ci/ctest-results.xml

  # Portability signal only. Linux has not been verified locally; failures here do not block merges
  # until the job has been green at least once.
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      GAMEENGINE_RESOURCES_DIR: ${{ github.workspace }}/../resources
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Fetch locked dependencies
        run: python3 -I cmake/scripts/fetch_dependencies.py "$GAMEENGINE_RESOURCES_DIR" box3d GameNetworkingSockets

      - name: Configure
        run: cmake --preset linux-gcc-debug -DGAMEENGINE_WARNINGS_AS_ERRORS=ON -DGAMEENGINE_STRICT_DEPENDENCY_LOCK=ON

      - name: Build
        run: cmake --build --preset linux-gcc-debug

      - name: Test
        run: ctest --preset linux-gcc-debug
